# nginx del sitio raqueldecoracion.com (lo copia el Dockerfile).
# EasyPanel (Traefik) termina HTTPS y reenvía aquí por el puerto 80.

# www -> dominio canónico (301)
server {
    listen 80;
    server_name www.raqueldecoracion.com;
    return 301 https://raqueldecoracion.com$request_uri;
}

# Sitio
server {
    listen 80 default_server;
    server_name raqueldecoracion.com _;
    root /usr/share/nginx/html;
    index index.html;

    absolute_redirect off;   # redirecciones relativas (detrás del proxy HTTPS)
    server_tokens off;
    autoindex off;
    charset utf-8;

    # Compresión
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_vary on;
    gzip_types text/plain text/css text/xml application/xml application/javascript application/json image/svg+xml;

    # Seguridad básica
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Archivos ocultos (.git, .DS_Store, etc.) nunca se sirven
    location ~ /\. { return 404; }

    # Páginas HTML: siempre la versión más reciente
    location ~* \.html?$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        try_files $uri =404;
    }

    # Imágenes, fuentes, video, CSS y JS: caché de 30 días
    location ~* \.(?:jpe?g|png|gif|webp|avif|svg|ico|woff2?|mp4|webm|css|js)$ {
        expires 30d;
        add_header Cache-Control "public" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
